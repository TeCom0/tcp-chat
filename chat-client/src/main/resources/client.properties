# Default server address used by the chat client (bundled inside the JAR).
# Priority: command-line arguments  >  client.properties in the folder you start
# the client from  >  this bundled file  >  built-in defaults (localhost:3001).
#   java TCPClient 192.168.1.20 3001   ignores this file completely.

# Host name or IP address of the machine running TCPServer.
server.ip=localhost

# Must match server.port in the server's server.properties.
server.port=3001
