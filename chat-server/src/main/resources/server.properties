# Default network settings of the chat server (bundled inside the JAR).
# To change them WITHOUT recompiling, put a copy of this file named
# server.properties in the folder you start the server from: it wins.

# Address to listen on. 0.0.0.0 = every network interface of this machine
# (Wi-Fi, Ethernet, localhost). Use 127.0.0.1 to accept local clients only.
server.ip=0.0.0.0

# TCP port the clients connect to.
server.port=3001
